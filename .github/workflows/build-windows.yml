name: build-windows
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:

  generate-soh-otr:
    runs-on: ubuntu-22.04
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        max-size: "2G"
        key: ${{ runner.os }}-otr-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-otr-ccache
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $(cat linux-build-deps/apt.txt)
    - name: Add ccache to PATH
      run: echo "/usr/lib/ccache" >> "$GITHUB_PATH"
    - name: Generate soh.o2r
      run: |
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DSOH_TOOLS_ONLY=ON
        cmake --build build-cmake --config Release --target GenerateSohOtr -j4
    - name: Upload soh.o2r
      uses: actions/upload-artifact@v7
      with:
        name: soh.o2r
        path: soh.o2r
        retention-days: 3

  build-windows:
    needs: generate-soh-otr
    runs-on: windows-latest
    steps:
    - name: Install dependencies
      run: |
        choco install ninja -y
        Remove-Item -Path "C:\ProgramData\Chocolatey\bin\ccache.exe" -Force -ErrorAction SilentlyContinue
    - name: Git Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        max-size: "2G"
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache
    - name: Restore Cached VCPKG folder
      uses: actions/cache/restore@v5
      with:
        key: ${{ runner.os }}-vcpkg-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-
        path: vcpkg
    - name: Configure Developer Command Prompt
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64
    - name: Download soh.o2r
      uses: actions/download-artifact@v8
      with:
        name: soh.o2r
        path: build-windows/soh
    - name: Build Hyrule of Warcraft
      env:
        VCPKG_ROOT: ${{github.workspace}}/vcpkg
      run: |
        cmake -S . -B build-windows -G Ninja -DCMAKE_MAKE_PROGRAM=ninja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        cmake --build build-windows --config Release --parallel 4
        (cd build-windows && cpack)
        cd ..
    - name: Assemble game folder
      shell: pwsh
      run: |
        $zip = Get-ChildItem _packages/*.zip | Select-Object -First 1
        Expand-Archive -Path $zip.FullName -DestinationPath HyruleOfWarcraft
        Copy-Item -Path "dist/windows/*" -Destination HyruleOfWarcraft -Recurse -Force -ErrorAction SilentlyContinue
        Get-ChildItem HyruleOfWarcraft
    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: HyruleOfWarcraft-Windows
        path: HyruleOfWarcraft
    - name: Save Cache VCPKG folder
      if: always()
      uses: actions/cache/save@v5
      with:
        key: ${{ runner.os }}-vcpkg-${{ github.sha }}
        path: vcpkg
